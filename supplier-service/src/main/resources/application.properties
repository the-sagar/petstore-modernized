spring.application.name=supplier-service
server.port=8082
spring.mongodb.uri=mongodb://localhost:27017/petstore_supplier?replicaSet=rs0

spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616?initialConnectAttempts=1&reconnectAttempts=0&callTimeout=5000}
spring.artemis.user=${ARTEMIS_USER:petstore}
spring.artemis.password=${ARTEMIS_PASSWORD:petstore-dev}

petstore.inventory.requested-destination=${INVENTORY_REQUESTED_DESTINATION:petstore.inventory.requested}
petstore.inventory.fulfilled-destination=${INVENTORY_FULFILLED_DESTINATION:petstore.inventory.fulfilled}
