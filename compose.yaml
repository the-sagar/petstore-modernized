services:
  mongodb:
    image: mongo:7.0
    container_name: petstore-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: petstore_storefront
    volumes:
      - petstore-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  artemis:
    image: apache/artemis:2.57.0-alpine
    container_name: petstore-artemis
    restart: unless-stopped
    ports:
      - "127.0.0.1:61616:61616"
      - "127.0.0.1:8161:8161"
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-petstore}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-petstore-dev}
      ANONYMOUS_LOGIN: "false"
      # artemis.profile honors JAVA_ARGS instead of its default 512M initial heap.
      JAVA_ARGS: >-
        -Xms128m -Xmx256m -XX:+UseG1GC
        -Dhawtio.disableProxy=true -Dhawtio.realm=activemq -Dhawtio.offline=true
        -Dhawtio.rolePrincipalClasses=org.apache.activemq.artemis.spi.core.security.jaas.RolePrincipal
        -Djolokia.policyLocation=classpath:jolokia-access.xml
        --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
    volumes:
      - petstore-artemis-data:/var/lib/artemis-instance

volumes:
  petstore-mongo-data:
  petstore-artemis-data:
