spring.application.name=order-processing-service
server.port=8081
spring.mongodb.uri=mongodb://localhost:27017/petstore_orders?replicaSet=rs0

# Local development defaults; override credentials/URL through the environment.
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616?initialConnectAttempts=1&reconnectAttempts=0&callTimeout=5000}
spring.artemis.user=${ARTEMIS_USER:petstore}
spring.artemis.password=${ARTEMIS_PASSWORD:petstore-dev}
petstore.order.submitted-destination=${ORDER_SUBMITTED_DESTINATION:petstore.order.submitted}

petstore.inventory.requested-destination=${INVENTORY_REQUESTED_DESTINATION:petstore.inventory.requested}
petstore.inventory.fulfilled-destination=${INVENTORY_FULFILLED_DESTINATION:petstore.inventory.fulfilled}

# Optional best-effort email; enable for the local Mailpit demo.
petstore.notification.enabled=${NOTIFICATION_ENABLED:true}
petstore.notification.requested-destination=${NOTIFICATION_REQUESTED_DESTINATION:petstore.notification.requested}
petstore.notification.from=${NOTIFICATION_FROM:petstore@localhost}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Notification language comes from Order.locale, with English as the fallback.
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
