spring.application.name=storefront-service
server.port=8080
spring.mongodb.uri=mongodb://localhost:27017/petstore_storefront?replicaSet=rs0
spring.data.mongodb.auto-index-creation=true
logging.level.com.mdb.petstore=DEBUG
petstore.order-processing.base-url=http://localhost:8081
petstore.order-processing.connect-timeout=3s
petstore.order-processing.read-timeout=5s

petstore.admin.bootstrap.username=${PETSTORE_ADMIN_USERNAME:admin}
petstore.admin.bootstrap.password=${PETSTORE_ADMIN_PASSWORD:admin}

petstore.supplier.base-url=${PETSTORE_SUPPLIER_BASE_URL:http://localhost:8082}
petstore.supplier.connect-timeout=3s
petstore.supplier.read-timeout=5s
petstore.supplier.bootstrap.username=${PETSTORE_SUPPLIER_USERNAME:supplier}
petstore.supplier.bootstrap.password=${PETSTORE_SUPPLIER_PASSWORD:supplier}

# English fallback is independent of the host machine language.
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
