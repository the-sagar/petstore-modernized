<!DOCTYPE html>
<html lang="en-US" th:lang="${effectiveLocale}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="#{item.pageTitle}">Item detail · Petstore</title>
    <link rel="stylesheet" href="/css/petstore.css" th:href="@{/css/petstore.css}">
    <script defer src="/assets/storefront.js" th:src="@{/assets/storefront.js}"></script>
</head>
<body data-page="item">
<header th:replace="~{fragments/storefront :: navigation}"></header>
<main class="storefront">
    <section class="panel">
        <nav class="actions" th:aria-label="#{item.breadcrumbs}">
            <a href="/shop" data-locale-link th:text="#{nav.shop}">Shop</a>
            <span id="item-context" hidden>
                <a id="category-link"></a> / <a id="product-link"></a>
            </span>
        </nav>
        <h1 th:text="#{item.title}">Item detail</h1>
        <p id="message" class="message" role="status" aria-live="polite" th:text="#{common.loading}">Loading…</p>
        <article id="item-content" hidden>
            <h2 id="item-product-name"></h2>
            <div id="item-image"></div>
            <dl>
                <dt th:text="#{item.id}">Item ID</dt><dd id="item-id"></dd>
                <dt th:text="#{item.description}">Description</dt><dd id="item-description"></dd>
                <dt th:text="#{item.attributes}">Attributes</dt><dd id="item-attributes"></dd>
                <dt th:text="#{item.price}">Price</dt><dd id="item-price" class="item-price"></dd>
            </dl>
            <p class="hint" th:text="#{product.hint}">Adding an item sets its cart quantity to 1, including items already in your cart.</p>
            <div id="item-actions" class="actions">
                <a href="/cart" data-locale-link th:text="#{cart.view}">View cart</a>
            </div>
        </article>
    </section>
    <noscript><p class="message" th:text="#{common.enableJs}">Please enable JavaScript to browse and shop.</p></noscript>
</main>
</body>
</html>
