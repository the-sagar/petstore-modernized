<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Product · Petstore</title>
    <link rel="stylesheet" href="/css/petstore.css" th:href="@{/css/petstore.css}">
    <script defer src="/assets/storefront.js" th:src="@{/assets/storefront.js}"></script>
</head>
<body data-page="product">
<header th:replace="~{fragments/storefront :: navigation}"></header>
<main class="storefront">
    <section class="panel">
        <a id="category-link" href="/shop" data-locale-link>Back to category</a>
        <h1 id="product-name">Product</h1>
        <p id="product-description"></p>
<p id="message" class="message" role="status" aria-live="polite">Loading…</p>
        <h2>Available items</h2>
        <p class="hint">Adding an item sets its cart quantity to 1, including items already in your cart.</p>
        <div id="items" class="cards"></div>
        <nav id="catalog-pagination" class="actions" aria-label="Catalog pagination" hidden>
            <button id="catalog-previous" type="button" disabled>Previous</button>
            <span id="catalog-page" role="status" aria-live="polite"></span>
            <button id="catalog-next" type="button" disabled>Next</button>
        </nav>
        <p><a href="/cart" data-locale-link>View cart</a></p>
    </section>
    <noscript><p class="message">Please enable JavaScript to browse and shop.</p></noscript>
</main>
</body>
</html>
