<!DOCTYPE html>
<html lang="en-US" th:lang="${effectiveLocale}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="#{nav.shop.pageTitle}">Shop · Petstore</title>
    <link rel="stylesheet" href="/css/petstore.css" th:href="@{/css/petstore.css}">
    <script defer src="/assets/storefront.js" th:src="@{/assets/storefront.js}"></script>
</head>
<body data-page="shop">
<header th:replace="~{fragments/storefront :: navigation}"></header>
<main class="storefront">
    <section class="panel">
        <h1 th:text="#{shop.heading}">Find your next companion</h1>
        <p th:text="#{shop.intro}">Browse the catalog or search for a pet.</p>
        <form id="search-form" class="search-form" role="search">
            <label for="search-query" th:text="#{shop.searchLabel}">Search products</label>
            <div class="actions"><input id="search-query" name="q" type="search" placeholder="Try Angelfish" th:placeholder="#{shop.placeholder}" autocomplete="off">
            <button type="submit" th:text="#{shop.search}">Search</button></div>
        </form>
<p id="message" class="message" role="status" aria-live="polite" th:text="#{common.loading}">Loading…</p>
        <section id="category-section"><h2 th:text="#{shop.categories}">Categories</h2><div id="categories" class="cards"></div></section>
        <section id="search-section" hidden><h2 th:text="#{shop.results}">Search results</h2><div id="search-results" class="cards"></div></section>
        <nav id="catalog-pagination" class="actions" aria-label="Catalog pagination" th:aria-label="#{common.pagination}" hidden>
            <button id="catalog-previous" type="button" disabled th:text="#{common.previous}">Previous</button>
            <span id="catalog-page" role="status" aria-live="polite"></span>
            <button id="catalog-next" type="button" disabled th:text="#{common.next}">Next</button>
        </nav>
    </section>
    <noscript><p class="message" th:text="#{common.enableJs}">Please enable JavaScript to browse and shop.</p></noscript>
</main>
</body>
</html>
