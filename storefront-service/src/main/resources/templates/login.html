<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Petstore</title>
    <link rel="stylesheet" th:href="@{/css/petstore.css}" href="/css/petstore.css">
</head>
<body>
<main class="narrow">
    <p class="brand">Petstore</p>
    <section class="panel">
        <h1>Welcome back</h1>
        <p>Sign in to manage your account.</p>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <form id="login-form" method="post" th:action="@{/api/auth/login}" class="stack">
            <label>Username <input name="username" autocomplete="username" required autofocus></label>
            <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Sign in</button>
            <a th:href="@{/register}" href="/register">Create an account</a>
        </form>
        <noscript><p>Please enable JavaScript to use this demo.</p></noscript>
    </section>
</main>
<script th:inline="javascript">
    const accountUrl = /*[[@{/account}]]*/ '/account';
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');
    form.addEventListener('submit', async event => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        message.textContent = '';
        try {
            const response = await fetch(form.action, {
                method: 'POST', credentials: 'same-origin',
                body: new URLSearchParams(new FormData(form))
            });
            if (response.status === 200) {
                form.elements.password.value = '';
                window.location.assign(accountUrl);
            } else {
                message.className = 'message error';
                message.textContent = response.status === 401
                    ? 'Invalid username or password' : 'Unable to sign in. Please try again.';
            }
        } catch {
            message.className = 'message error';
            message.textContent = 'Unable to connect. Please try again.';
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
