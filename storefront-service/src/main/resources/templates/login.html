<!DOCTYPE html>
<html lang="en-US" th:lang="${effectiveLocale}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title.pageTitle}">Sign in · Petstore</title>
    <link rel="stylesheet" th:href="@{/css/petstore.css}" href="/css/petstore.css">
    <script defer src="/assets/storefront.js" th:src="@{/assets/storefront.js}"></script>
</head>
<body>
<header th:replace="~{fragments/storefront :: navigation}"></header>
<main class="narrow">
    <section class="panel">
        <h1 th:text="#{login.heading}">Welcome back</h1>
        <p th:text="#{login.intro}">Sign in to checkout or manage your account.</p>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <form id="login-form" method="post" th:action="@{/api/auth/login}" class="stack">
            <label><span th:text="#{login.username}">Username</span> <input name="username" autocomplete="username" required autofocus></label>
            <label><span th:text="#{login.password}">Password</span> <input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit" th:text="#{login.title}">Sign in</button>
            <a th:href="@{/register}" href="/register" th:text="#{login.create}">Create an account</a>
        </form>
        <noscript><p th:text="#{common.enableDemoJs}">Please enable JavaScript to use this demo.</p></noscript>
    </section>
</main>
<script th:inline="javascript">
    const supplierInventoryUrl = /*[[@{/supplier/inventory}]]*/ '/supplier/inventory';
    const adminOrdersUrl = /*[[@{/admin/orders}]]*/ '/admin/orders';
    const shopUrl = /*[[@{/shop}]]*/ '/shop';
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');
    form.addEventListener('submit', async event => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        message.textContent = '';
        try {
            const response = await fetch(window.petstoreUrl(form.action), {
                method: 'POST', credentials: 'same-origin',
                body: new URLSearchParams(new FormData(form))
            });
            if (response.status === 200) {
                form.elements.password.value = '';
                const login = await response.json();
                // Deterministic multi-role precedence: ADMIN, then SUPPLIER, then Shop.
                if (Array.isArray(login.roles) && login.roles.includes('ROLE_ADMIN')) {
                    window.location.assign(adminOrdersUrl);
                } else if (Array.isArray(login.roles) && login.roles.includes('ROLE_SUPPLIER')) {
                    window.location.assign(supplierInventoryUrl);
                } else {
                    window.location.assign(shopUrl);
                }
            } else {
                message.className = 'message error';
                message.textContent = response.status === 401
                    ? window.petstoreText('js.invalidLogin') : window.petstoreText('js.loginFailed');
            }
        } catch {
            message.className = 'message error';
            message.textContent = window.petstoreText('js.connectRetry');
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
