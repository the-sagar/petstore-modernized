<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Supplier fulfilments · Petstore</title>
    <link rel="stylesheet" href="/css/petstore.css" th:href="@{/css/petstore.css}">
    <script defer src="/assets/supplier.js" th:src="@{/assets/supplier.js}"></script>
</head>
<body data-supplier-page="orders">
<header th:replace="~{fragments/storefront :: navigation}"></header>
<main class="storefront">
    <h1>Supplier fulfilments</h1>
    <section class="panel">
        <div class="actions">
            <label>Status <select id="fulfilment-status">
                <option value="PENDING" selected>Pending</option>
                <option value="COMPLETED">Completed</option>
                <option value="">All</option>
            </select></label>
            <button id="refresh-supplier" type="button">Refresh fulfilments</button>
            <button id="retry-pending" type="button">Retry pending fulfilments</button>
        </div>
        <p id="supplier-message" class="message" role="status" aria-live="polite"></p>
        <div class="table-scroll">
            <table id="supplier-orders-table">
                <thead><tr><th>Order ID</th><th>Status</th><th>Created</th><th>Updated</th><th>Lines</th><th>Progress</th></tr></thead>
                <tbody id="fulfilment-rows"></tbody>
            </table>
        </div>
    </section>
    <noscript><p>Please enable JavaScript to use Supplier tools.</p></noscript>
</main>
</body>
</html>
