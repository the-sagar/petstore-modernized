<text x="739.0" y="439" font-size="20" font-weight="600" text-anchor="middle" fill="#25313c">petstore_orders · authoritative Order</text>
<text x="36" y="410" font-size="22" font-weight="600" text-anchor="start" fill="#25313c">Identifier-only event</text>
<text x="36" y="445" font-size="20" font-weight="400" text-anchor="start" fill="#25313c">Order snapshot supplies email + locale.</text>
<path d="M739 466 V507" fill="none" stroke="#596572" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
