<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="778" viewBox="0 0 1000 778" role="img" aria-labelledby="title desc">
<title id="title">Local development · email delivery</title><desc id="desc">Mailpit is a local SMTP sink and inbox viewer only.</desc>
<!-- Shared visual system: Arial/Helvetica; 32/24/20px; explicit off-white background.
     Rounded service cards; green database cylinders; violet event pills.
     Dashed arrow = asynchronous messaging. Other connectors are labeled by context. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#596572"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#25313c">
<rect width="1000" height="778" fill="#fafaf7"/>
<text x="36" y="48" font-size="32" font-weight="600" text-anchor="start" fill="#25313c">Local development · email delivery</text>
<text x="36" y="82" font-size="20" font-weight="400" text-anchor="start" fill="#25313c">Mailpit is a local SMTP sink and inbox viewer only.</text>
<rect x="36" y="130" width="408" height="64" rx="12" fill="#eaf5f2" stroke="#357c70" stroke-width="1.5"/>
<text x="240.0" y="169.0" font-size="22" font-weight="600" text-anchor="middle" fill="#25313c">Order Processing</text>
