<text x="534" y="195" font-size="20" font-weight="400" text-anchor="start" fill="#25313c">petstore.notification.requested</text>
<path d="M739 226 V268" fill="none" stroke="#596572" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="514" y="272" width="450" height="64" rx="12" fill="#eaf5f2" stroke="#357c70" stroke-width="1.5"/>
<text x="739.0" y="311.0" font-size="22" font-weight="600" text-anchor="middle" fill="#25313c">Notification Listener</text>
<text x="36" y="302" font-size="22" font-weight="600" text-anchor="start" fill="#25313c">Runs inside Order Processing</text>
<path d="M739 336 V383" fill="none" stroke="#596572" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
