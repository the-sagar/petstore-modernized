<text x="36" y="503" font-size="22" font-weight="600" text-anchor="start" fill="#25313c">SMTP · localhost:1025</text>
<rect x="36" y="511" width="408" height="133" rx="12" fill="#f1f3f5" stroke="#85919c" stroke-width="1.5"/>
<text x="56" y="545" font-size="24" font-weight="600" text-anchor="start" fill="#25313c">Mailpit</text>
