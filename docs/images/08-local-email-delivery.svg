<text x="36" y="696" font-size="20" font-weight="400" text-anchor="start" fill="#25313c">Best-effort delivery · SMTP failure leaves business state committed.</text>
<text x="36" y="732" font-size="20" font-weight="400" text-anchor="start" fill="#25313c">Dashed = asynchronous Artemis event · other connectors = local mail processing.</text>
