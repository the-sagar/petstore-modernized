<text x="544" y="1355" font-size="20" font-weight="400" text-anchor="start" fill="#25313c">Dashed = asynchronous Artemis event</text>
<text x="36" y="1387" font-size="20" font-weight="400" text-anchor="start" fill="#25313c">Other solid connectors: ownership, in-process mail steps and SMTP, as labeled.</text>
<text x="36" y="1421" font-size="20" font-weight="400" text-anchor="start" fill="#25313c">MongoDB / JMS publication is not atomic · no outbox or exactly-once guarantee.</text>
